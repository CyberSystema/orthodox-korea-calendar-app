# Continuous internal delivery: on every push to main, ship to the STAGING
# (preview) channel. Fingerprint decides per platform:
#   native changed  -> new internal (preview) build
#   JS-only change  -> over-the-air EAS Update on the `preview` branch
# No store submission here — staging is internal-distribution only.
name: Deploy to staging

on:
  push:
    branches: ['main']

concurrency:
  group: staging-${{ github.ref }}
  cancel_in_progress: true

jobs:
  quality:
    name: Quality gate
    runs_on: linux-medium
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - name: TypeScript
        run: npm run typecheck
      - name: i18n en/ko parity
        run: npm run i18n:check

  fingerprint:
    name: Fingerprint native layer
    needs: [quality]
    type: fingerprint
    environment: preview

  get_ios_build:
    name: Find matching iOS build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      profile: preview
  get_android_build:
    name: Find matching Android build
    needs: [fingerprint]
    type: get-build
    params:
      fingerprint_hash: ${{ needs.fingerprint.outputs.android_fingerprint_hash }}
      profile: preview

  # NATIVE CHANGED -> new internal build (no matching fingerprint on file)
  build_ios:
    name: Build iOS (preview)
    needs: [get_ios_build]
    if: ${{ !needs.get_ios_build.outputs.build_id }}
    type: build
    params:
      platform: ios
      profile: preview
  build_android:
    name: Build Android (preview)
    needs: [get_android_build]
    if: ${{ !needs.get_android_build.outputs.build_id }}
    type: build
    params:
      platform: android
      profile: preview

  # JS-ONLY -> OTA update to the staging channel
  update_ios:
    name: OTA update (iOS, staging)
    needs: [get_ios_build]
    if: ${{ needs.get_ios_build.outputs.build_id }}
    type: update
    params:
      branch: preview
      platform: ios
  update_android:
    name: OTA update (Android, staging)
    needs: [get_android_build]
    if: ${{ needs.get_android_build.outputs.build_id }}
    type: update
    params:
      branch: preview
      platform: android
