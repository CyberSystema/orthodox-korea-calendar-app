# Maestro E2E smoke test — OPT-IN per PR (E2E build + device minutes are billable).
# Trigger it by adding the label "e2e" to a pull request.
# Builds a credential-free Android APK and runs the flows in .maestro/ on it.
name: E2E smoke (Maestro)

on:
  pull_request_labeled:
    labels: ['e2e']

jobs:
  build:
    name: Build for testing (Android APK)
    type: build
    params:
      platform: android
      profile: e2e-test

  maestro:
    name: Maestro smoke flows
    needs: [build]
    type: maestro
    params:
      build_id: ${{ needs.build.outputs.build_id }}
      flow_path: ['.maestro/smoke.yml', '.maestro/deep-link.yml']
